<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>NutriIndex</title>
    <base href="/" />
    <link href="css/bootstrap/bootstrap.min.css" rel="stylesheet" />
    <link href="css/app.css" rel="stylesheet" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="manifest.json" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <script src="build.js"></script>
    <script>
        (function () {
            var host = location.hostname;
            if (host !== "localhost" && host !== "127.0.0.1") {
                return;
            }

            if ("serviceWorker" in navigator) {
                navigator.serviceWorker.getRegistrations().then(function (regs) {
                    regs.forEach(function (reg) { reg.unregister(); });
                });
            }

            if ("caches" in window) {
                caches.keys().then(function (keys) {
                    keys.forEach(function (key) { caches.delete(key); });
                });
            }
        })();
    </script>
    <script src="lib/zxing-browser.min.js"></script>
    <script>
        (function () {
            var version = (window.__NUTRIINDEX_BUILD__ && window.__NUTRIINDEX_BUILD__.assetVersion) || Date.now();
            var script = document.createElement("script");
            script.src = "js/barcode.js?v=" + encodeURIComponent(version);
            document.head.appendChild(script);
        })();
    </script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
